<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous">

  <title>Aplikasi CRUD Google Sheets</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Management</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f5f7fb;
    }

    .app-card {
      border: 0;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .table th {
      white-space: nowrap;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 1050;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.75);
    }

    .loading-overlay.show {
      display: flex;
    }

    .empty-state {
      padding: 32px;
      color: #6c757d;
      text-align: center;
    }

    .truncate {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="text-center">
      <div class="spinner-border text-primary mb-2"></div>
      <div>Memproses data...</div>
    </div>
  </div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <h1 class="h3 mb-1">Data Management</h1>
        <p class="text-muted mb-0">
          CRUD sederhana dengan Google Sheets
        </p>
      </div>

      <button id="exportButton" class="btn btn-success">
        Download CSV
      </button>
    </div>

    <div id="alertContainer"></div>

    <div class="card app-card mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Form Data</h2>

        <form id="dataForm">
          <input type="hidden" id="recordId">

          <div class="row g-3">
            <div class="col-md-6">
              <label for="nama" class="form-label">Nama</label>
              <input
                type="text"
                id="nama"
                class="form-control"
                maxlength="100"
                required
              >
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                class="form-control"
                maxlength="150"
                required
              >
            </div>

            <div class="col-md-6">
              <label for="kategori" class="form-label">Kategori</label>
              <select id="kategori" class="form-select" required>
                <option value="">Pilih kategori</option>
                <option value="Internal">Internal</option>
                <option value="Eksternal">Eksternal</option>
                <option value="Vendor">Vendor</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="catatan" class="form-label">Catatan</label>
              <input
                type="text"
                id="catatan"
                class="form-control"
                maxlength="250"
              >
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <span id="submitText">Simpan Data</span>
            </button>

            <button
              type="button"
              id="cancelEditButton"
              class="btn btn-outline-secondary d-none"
            >
              Batal Edit
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="card app-card">
      <div class="card-body">
        <div class="row align-items-center g-3 mb-3">
          <div class="col-md-8">
            <input
              type="search"
              id="searchInput"
              class="form-control"
              placeholder="Cari nama, email, kategori, atau catatan..."
            >
          </div>

          <div class="col-md-4 text-md-end">
            <button id="refreshButton" class="btn btn-outline-primary">
              Refresh Data
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>No.</th>
                <th>Nama</th>
                <th>Email</th>
                <th>Kategori</th>
                <th>Catatan</th>
                <th>Updated</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state d-none">
          Tidak ada data yang ditemukan.
        </div>
      </div>
    </div>
  </main>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="script.js"></script>
</body>
</html>
